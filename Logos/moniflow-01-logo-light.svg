<?xml version="1.0" encoding="UTF-8"?>
<!--
  MoniFlow — Logo 01
  Variación: Marca completa sobre fondo blanco o crema
  Uso: Navbar (light mode), tarjetas de presentación, firma de email, documentos
  Fondo recomendado: #ffffff o #f0f5f3
  Tamaño mínimo: 120px de ancho
  viewBox: 220×56 (proporción del símbolo 1:1 internamente)

  CONSTRUCCIÓN DEL SÍMBOLO (coordenadas base 100×100, escala 0.50):
  5 zonas uniformes de 20px:
    [0–20]  Pierna izquierda exterior
    [20–40] Diagonal izquierda (top x=20..40, bottom x=30..50)
    [40–60] Valle — barras del chart
    [60–80] Diagonal derecha (top x=60..80, bottom x=50..70)
    [80–100] Pierna derecha exterior
  Diagonales paran en y=52. Piernas continúan hasta y=100.
  Barras chart: izq x=32..43 y=72..100, centro x=44..57 y=56..100, der x=58..69 y=72..100
-->
<svg width="220" height="56"
     viewBox="0 0 220 56"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="MoniFlow">
  <title>MoniFlow</title>
  <desc>MoniFlow — marca completa sobre fondo claro</desc>
  <g transform="translate(2, 0) scale(0.50)">
    <!-- Pierna izquierda -->
    <rect x="0"  y="0" width="20" height="100" fill="#0b1712"/>
    <!-- Diagonal izquierda — para en y=52 -->
    <polygon points="20,0 40,0 50,52 30,52" fill="#0b1712"/>
    <!-- Diagonal derecha — espejo exacto -->
    <polygon points="60,0 80,0 70,52 50,52" fill="#0b1712"/>
    <!-- Pierna derecha -->
    <rect x="80" y="0" width="20" height="100" fill="#0b1712"/>
    <!-- Barras chart dentro del valle -->
    <rect x="32" y="72" width="11" height="28" rx="1.5" fill="#00b894"/>
    <rect x="44" y="56" width="13" height="44" rx="1.5" fill="#00b894"/>
    <rect x="58" y="72" width="11" height="28" rx="1.5" fill="#00b894"/>
  </g>
  <!-- Wordmark: DM Sans SemiBold, letter-spacing -0.01em -->
  <text x="58" y="37"
        font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600"
        font-size="26"
        letter-spacing="-0.25"
        fill="#111816">MoniFlow</text>
</svg>
