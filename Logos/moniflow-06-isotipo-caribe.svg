<?xml version="1.0" encoding="UTF-8"?>
<!--
  MoniFlow — Isotipo 06
  Variación: Solo símbolo versión Caribe
  Uso: Elemento de acento sobre fondos oscuros, notificaciones, badges activos
  Fondo recomendado: #0b1712 únicamente
  Tamaño mínimo: 32px
  viewBox: 100×100 — CUADRADO PERFECTO 1:1
  NOTA: No usar sobre fondos claros
-->
<svg width="100" height="100"
     viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="MoniFlow">
  <title>MoniFlow — símbolo Caribe</title>
  <desc>MoniFlow isotipo versión Caribe sobre fondo oscuro</desc>
  <rect x="0"  y="0" width="20" height="100" fill="#00b894"/>
  <polygon points="20,0 40,0 50,52 30,52" fill="#00b894"/>
  <polygon points="60,0 80,0 70,52 50,52" fill="#00b894"/>
  <rect x="80" y="0" width="20" height="100" fill="#00b894"/>
  <rect x="32" y="72" width="11" height="28" rx="1.5" fill="#55d8b4"/>
  <rect x="44" y="56" width="13" height="44" rx="1.5" fill="#55d8b4"/>
  <rect x="58" y="72" width="11" height="28" rx="1.5" fill="#55d8b4"/>
</svg>
